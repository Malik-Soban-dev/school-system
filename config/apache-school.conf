ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 3
    MaxConnectionsPerChild 1000
</IfModule>
